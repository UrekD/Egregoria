on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  # Manual runs build and upload the archives as workflow artifacts only;
  # a GitHub release is created for tag pushes.
  workflow_dispatch:

name: Create Release

env:
  # Could, potentially automatically parse
  # the bin name, but let's do it automatically for now.
  RELEASE_BIN: native_app
  HEADLESS_BIN: headless

  # Space separated paths to include in the archive.
  # Start relative paths with a dot if you don't want
  # paths to be preserved. Use "/" as a delimiter.
  # base_mod holds the Lua prototypes both binaries load at startup.
  RELEASE_ADDS: README.md LICENSE assets base_mod
  HEADLESS_ADDS: README.md LICENSE assets/paris_54000.txt base_mod

jobs:
  build:
    name: Build and upload release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            exe: ''
          - build: macos
            os: macos-latest
            exe: ''
          - build: windows
            os: windows-latest
            exe: '.exe'

    steps:
      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: install deps for linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev
        if: matrix.os == 'ubuntu-latest'

      - name: Build app
        run: cargo build --locked --release -p ${{ env.RELEASE_BIN }}

      - name: Build headless
        run: cargo build --locked --release -p ${{ env.HEADLESS_BIN }}

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Install p7zip
        # 7Zip not available on MacOS, install p7zip via homebrew.
        run: brew install p7zip
        if: matrix.os == 'macos-latest'

      - name: Create app archive
        shell: bash
        run: 7z a -tzip ./artifacts/egregoria-${{ matrix.os }}.zip ./target/release/${{ env.RELEASE_BIN }}${{ matrix.exe }} ${{ env.RELEASE_ADDS }}

      - name: Create headless archive
        shell: bash
        run: 7z a -tzip ./artifacts/egregoria-${{ matrix.os }}-headless.zip ./target/release/${{ env.HEADLESS_BIN }}${{ matrix.exe }} ${{ env.HEADLESS_ADDS }}

      - name: Check archives contain the prototypes
        shell: bash
        run: |
          for f in artifacts/*.zip; do
            7z l "$f" | grep -q 'base_mod[/\\]data.lua' || { echo "$f is missing base_mod/data.lua"; exit 1; }
          done

      # Artifact names must be unique per run.
      - uses: actions/upload-artifact@v4
        name: Upload archives
        with:
          name: egregoria-${{ matrix.os }}
          path: artifacts/*.zip
          if-no-files-found: error

  create-release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: egregoria-*
          path: artifacts/
          merge-multiple: true

      - name: Name release assets
        run: |
          cd artifacts
          mv egregoria-macos-latest.zip macos.zip
          mv egregoria-ubuntu-latest.zip linux.zip
          mv egregoria-windows-latest.zip windows.zip
          mv egregoria-macos-latest-headless.zip macos-headless.zip
          mv egregoria-ubuntu-latest-headless.zip linux-headless.zip
          mv egregoria-windows-latest-headless.zip windows-headless.zip
          ls -l

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "Release ${GITHUB_REF_NAME}"
          artifacts/macos.zip artifacts/linux.zip artifacts/windows.zip
          artifacts/macos-headless.zip artifacts/linux-headless.zip artifacts/windows-headless.zip
