on:
  push:
    tags:
      - 'v*'
  # Tag dispatches publish a release. Branch dispatches build workflow artifacts.
  workflow_dispatch:

name: Create Release

env:
  # Could, potentially automatically parse
  # the bin name, but let's do it automatically for now.
  RELEASE_BIN: native_app
  HEADLESS_BIN: headless

  # Space separated paths to include in the archive.
  # Start relative paths with a dot if you don't want
  # paths to be preserved. Use "/" as a delimiter.
  # base_mod holds the Lua prototypes both binaries load at startup.
  RELEASE_ADDS: README.md LICENSE assets base_mod world
  HEADLESS_ADDS: README.md LICENSE assets/paris_54000.txt base_mod

jobs:
  cities:
    name: Generate release cities
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Generate playable save slots
        shell: bash
        timeout-minutes: 60
        run: scripts/build-windows-with-slots.sh --release-slots world "${CARGO_TARGET_DIR:-target}"

      - name: Create cities archive
        run: 7z a -tzip cities.zip world

      - uses: actions/upload-artifact@v4
        name: Upload cities archive
        with:
          name: egregoria-cities
          path: cities.zip
          if-no-files-found: error

  build:
    name: Build and upload release
    needs: cities
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, windows]  # macos disabled for now (hosted runner capacity)
        include:
          - build: linux
            os: ubuntu-latest
            exe: ''
          - build: windows
            os: windows-latest
            exe: '.exe'

    steps:
      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: install deps for linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev
        if: matrix.os == 'ubuntu-latest'

      - name: Build app
        run: cargo build --locked --release -p ${{ env.RELEASE_BIN }}

      - name: Build headless
        run: cargo build --locked --release -p ${{ env.HEADLESS_BIN }}

      - name: Create artifact directory
        run: mkdir -p artifacts

      - uses: actions/download-artifact@v4
        name: Download cities archive
        with:
          name: egregoria-cities
          path: release-cities/

      - name: Extract playable save slots
        shell: bash
        run: 7z x release-cities/cities.zip

      - name: Create app archive
        shell: bash
        run: 7z a -tzip ./artifacts/egregoria-${{ matrix.os }}.zip ./target/release/${{ env.RELEASE_BIN }}${{ matrix.exe }} ${{ env.RELEASE_ADDS }}

      - name: Create headless archive
        shell: bash
        run: 7z a -tzip ./artifacts/egregoria-${{ matrix.os }}-headless.zip ./target/release/${{ env.HEADLESS_BIN }}${{ matrix.exe }} ${{ env.HEADLESS_ADDS }}

      - name: Check archives contain the prototypes
        shell: bash
        run: |
          for f in artifacts/*.zip; do
            listing=$(7z l -slt "$f") || exit 1
            if ! grep -Fxq -e 'Path = base_mod/data.lua' -e 'Path = base_mod\data.lua' \
              <<< "${listing//$'\r'/}"; then
              printf '%s is missing base_mod/data.lua\n' "$f" >&2
              exit 1
            fi
          done

      - name: Check desktop archive contains the save slots
        shell: bash
        run: |
          archive=artifacts/egregoria-${{ matrix.os }}.zip
          listing=$(7z l -slt "$archive")
          listing=${listing//$'\r'/}
          listing=${listing//\\//}
          for slot in starter_town showcase_city lesce_osm lesce_town; do
            for suffix in zip meta.json; do
              entry="world/$slot.$suffix"
              if ! grep -Fxq "Path = $entry" <<< "$listing"; then
                printf '%s is missing %s\n' "$archive" "$entry" >&2
                exit 1
              fi
            done
          done

      # Artifact names must be unique per run.
      - uses: actions/upload-artifact@v4
        name: Upload archives
        with:
          name: egregoria-${{ matrix.os }}
          path: artifacts/*.zip
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [cities, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: egregoria-*
          path: artifacts/
          merge-multiple: true

      - name: Name release assets
        run: |
          cd artifacts
          mv egregoria-ubuntu-latest.zip linux.zip
          mv egregoria-windows-latest.zip windows.zip
          mv egregoria-ubuntu-latest-headless.zip linux-headless.zip
          mv egregoria-windows-latest-headless.zip windows-headless.zip
          ls -l

      - name: Create release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verify_release_tag() {
            local refs tag_sha
            if ! refs=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              ls-remote --exit-code -- "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_REF" "$GITHUB_REF^{}"); then
              printf 'Could not resolve release tag %s\n' "$GITHUB_REF" >&2
              return 1
            fi
            tag_sha=$(awk -v ref="$GITHUB_REF" '
              $2 == ref { sha = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled ? peeled : sha) }
            ' <<< "$refs")
            if [[ $tag_sha != "$GITHUB_SHA" ]]; then
              printf 'Release tag %s resolves to %s, but the build used %s\n' \
                "$GITHUB_REF" "${tag_sha:-no commit}" "$GITHUB_SHA" >&2
              return 1
            fi
          }

          # Give each attempt its own draft so publication cannot pick up an older draft's assets.
          draft_tag="release-draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verify_release_tag
          gh release create "$draft_tag" \
            --draft --repo "$GITHUB_REPOSITORY" --title "Release $GITHUB_REF_NAME" \
            artifacts/linux.zip artifacts/windows.zip artifacts/cities.zip \
            artifacts/linux-headless.zip artifacts/windows-headless.zip
          verify_release_tag
          gh release edit "$draft_tag" --draft=false \
            --tag "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --verify-tag --repo "$GITHUB_REPOSITORY"
